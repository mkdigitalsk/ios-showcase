name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ios:
    name: Build & Tests
    runs-on: xcode-27
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Create the simulator
        run: xcrun simctl create "iPhone 17 Pro Max" "iPhone 17 Pro Max"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Install SwiftFormat
        # The Makefile refuses any other version, and the image preinstalls the newest one on the PATH
        # ahead of /usr/local/bin — so the pinned binary goes into its own directory, put first.
        run: |
          mkdir -p "$RUNNER_TEMP/swiftformat"
          curl -fsSL -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat.zip
          unzip -o swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version

      - name: CI checks
        run: ./scripts/run-ci-checks.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: .build/derivedData/Logs/Test/*.xcresult
