name: TemplateIOS

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_COMPILATION_MODE: singlefile
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

packages:
  DesignSystem:
    path: Packages/DesignSystem
  TemplateAPI:
    path: Packages/TemplateAPI
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.2

targets:
  TemplateIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: DesignSystem
      - package: TemplateAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TemplateIOS.entitlements
    scheme:
      testTargets:
        - UnitTests
        - SnapshotTests

  UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/UnitTests
    dependencies:
      - target: TemplateIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  SnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # The references are read from the source tree by path; as bundle resources their names would
      # collide across suites.
      - path: Tests/SnapshotTests
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: TemplateIOS
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
