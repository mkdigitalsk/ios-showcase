appId: sk.mkdigital.templateios.debug
name: Storage — the in-memory count ends with the process, the on-disk one survives it
tags:
  - needs-api
---
# BR: Storage · The in-memory count ends with the process, the on-disk one survives it
# Given `In memory` at 2 and `On disk` at 1
# When the app is relaunched
# Then `In memory` is back to 0
# And `On disk` is still 1
#
# Given counts on both
# When the user resets both
# Then both are back to 0

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- tapOn: "Storage"
- extendedWaitUntil:
    visible: "In memory"
    timeout: 20000

- tapOn:
    text: "Add one"
    index: 0
- tapOn:
    text: "Add one"
    index: 0
- tapOn:
    text: "Add one"
    index: 1
- assertVisible: "^2$"
- assertVisible: "^1$"

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Storage"
    timeout: 30000
- tapOn: "Storage"
- extendedWaitUntil:
    visible: "In memory"
    timeout: 20000
- assertVisible: "^1$"
- assertVisible: "^0$"
- assertNotVisible: "^2$"

- tapOn: "Reset both"
- extendedWaitUntil:
    notVisible: "^1$"
    timeout: 10000
