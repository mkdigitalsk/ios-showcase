appId: sk.mkdigital.templateios.debug
name: Networking — a save the server refuses as stale keeps the draft on "Keep mine"
tags:
  - needs-api
onFlowStart:
  - evalScript: ${output.title = 'Maestro conflict ' + Date.now()}
onFlowComplete:
  - runScript:
      file: ../scripts/delete-notes-on-server.js
      env:
        TITLE: ${output.title}
        EMAIL: ${E2E_EMAIL}
        PASSWORD: ${E2E_PASSWORD}
---
# BR: Networking · A save over a newer server copy asks first, and `Keep mine` keeps the app's draft
# Given a note open for editing in the app
# And the note changed on the server since
# When the app's edit is saved
# Then `This note changed elsewhere` shows
#
# Given `This note changed elsewhere` on screen
# When the user keeps their draft
# Then the app's draft is listed, not the server's change

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- tapOn: "Networking"
- extendedWaitUntil:
    visible: "A remote server demonstration.*"
    timeout: 20000
- tapOn: "Enter note title…"
- inputText: ${output.title}
- tapOn: "Enter note content…"
- inputText: "written in the app"
# The keyboard's own Done — a multi-line field keeps the keyboard up otherwise.
- waitForAnimationToEnd
- tapOn: "Done"
- tapOn: "Add note"
- extendedWaitUntil:
    visible: "written in the app"
    timeout: 30000

- tapOn:
    text: "Edit note"
    below: ${output.title}

- runScript:
    file: ../scripts/move-note-on-server.js
    env:
      TITLE: ${output.title}
      EMAIL: ${E2E_EMAIL}
      PASSWORD: ${E2E_PASSWORD}
- assertTrue: ${output.movedStatus == 200}

- tapOn:
    id: "networking.edit.content"
- eraseText
- inputText: "kept from the app"
- waitForAnimationToEnd
- tapOn: "Done"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "This note changed elsewhere"
    timeout: 30000
- tapOn: "Keep mine"

- extendedWaitUntil:
    visible: "kept from the app"
    timeout: 30000
- assertNotVisible: "changed on the server"

- tapOn:
    text: "Delete note"
    below: ${output.title}
- extendedWaitUntil:
    notVisible: ${output.title}
    timeout: 30000
