appId: sk.mkdigital.templateios.debug
name: Answer the system's "Open in" confirmation for a link
---
# Answers iOS's "Open in" confirmation after openLink — left open, it covers the rest of the run.

- extendedWaitUntil:
    visible: "Open in .*"
    timeout: 5000
    optional: true
- tapOn:
    text: "^Open$"
    optional: true
