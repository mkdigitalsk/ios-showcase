appId: sk.mkdigital.templateios.debug
name: Sign in with the built-in test account
tags:
  - needs-api
---
# Signs in with the built-in test account on the app the caller launched, then waits for Home.

- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000

- tapOn: "Fill"
- tapOn:
    id: "signIn.submit"

- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
