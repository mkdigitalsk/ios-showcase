appId: sk.mkdigital.templateios.debug
name: APIs — clipboard, share sheet, missing apps and location each answer
tags:
  - needs-api
---
# BR: APIs · The clipboard, the share sheet, a missing app and the location each answer
# Given the APIs screen
# When the user copies the text
# Then `Copied to clipboard` shows
#
# Given the APIs screen
# When the user shares the text
# Then the share sheet opens, headed by the shared sentence
#
# Given a device with no Phone app
# When the user opens the dialer
# Then `No app on this device can open this` shows
#
# Given the device at a known position
# When the user asks for the location
# Then that position shows
#
# Given the device at a known position
# When the user starts tracking, then stops it
# Then the button reads `Stop Tracking` while it runs and `Start Tracking` after

- setLocation:
    latitude: 48.148598
    longitude: 17.107748

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- tapOn: "APIs"
- extendedWaitUntil:
    visible: "Share Text"
    timeout: 20000

# ⚠ Centered, because the floating tab bar covers the bottom of the screen and a tap there lands on the
# selected tab, which pops back to Home.
- scrollUntilVisible:
    element: "Copy Text"
    centerElement: true
- tapOn: "Copy Text"
- assertVisible: "Copied to clipboard"

- scrollUntilVisible:
    element: "Share Text"
    centerElement: true
    direction: UP
- tapOn: "Share Text"
- extendedWaitUntil:
    visible: "^Copy$"
    timeout: 15000
# The sheet's header is the shared text itself — the sentence, then the link.
- assertVisible: "iOS, Android, web and backend.*mkdigital.*"
- tapOn:
    point: "50%,12%"
- extendedWaitUntil:
    notVisible: "^Copy$"
    timeout: 10000

# ⚠ Written for the simulator, which has no Phone app — on a device the dialer opens.
- tapOn: "Open Dialer"
- extendedWaitUntil:
    visible: "No app on this device can open this"
    timeout: 10000

- scrollUntilVisible:
    element: "Get Location"
    centerElement: true
- tapOn: "Get Location"
- extendedWaitUntil:
    visible: "Lat: 48.14.*, Lon: 17.10.*"
    timeout: 30000

- scrollUntilVisible:
    element: "Start Tracking"
    centerElement: true
- tapOn: "Start Tracking"
- extendedWaitUntil:
    visible: "Stop Tracking"
    timeout: 10000
- tapOn: "Stop Tracking"
- extendedWaitUntil:
    visible: "Start Tracking"
    timeout: 10000
