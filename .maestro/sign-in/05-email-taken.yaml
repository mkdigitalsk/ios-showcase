appId: sk.mkdigital.templateios.debug
name: Sign up — an email that already has an account lands on the email field
tags:
  - needs-api
---
# BR: Sign up · An e-mail that already has an account is refused
# Given a fresh install, on the sign-up form
# When it is sent with an existing account's e-mail and a strong password
# Then `This email already has an account` shows

- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000
- tapOn: "Sign Up"
- extendedWaitUntil:
    visible: "Create Account"
    timeout: 10000

- tapOn: "Enter your email"
- inputText: "test01@mkdigital.sk"
# ⚠ iOS may cover a secure new-password field with its "Use Strong Password?" sheet, drawn outside the
# app's tree, and the keys typed under it are lost. The eye swaps in a plain field, which gets no sheet.
- tapOn:
    text: "Show password"
    index: 0
- tapOn: "Enter your password"
- inputText: "Strong1@pass"
- tapOn: "Show password"
- tapOn: "Confirm your password"
- inputText: "Strong1@pass"
- tapOn:
    id: "signUp.submit"

- extendedWaitUntil:
    visible: "This email already has an account"
    timeout: 30000
