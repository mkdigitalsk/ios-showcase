appId: sk.mkdigital.templateios.debug
name: Sign in — the form rejects what it can judge itself
---
# BR: Sign in · The form refuses what it can judge without the server
# Given a fresh install, signed out
# When the form is sent empty
# Then `Email is required` and `Password is required` show
#
# Given the sign-in form
# When it is sent with a malformed e-mail and a password under 8 characters
# Then `Invalid email format` and `Password must be at least 8 characters` show

- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000

# The submit button and the screen title read the same, so the button is tapped by its identifier.
- tapOn:
    id: "signIn.submit"
- assertVisible: "Email is required"
- assertVisible: "Password is required"

# An empty field shows its placeholder, which is what the tap names.
- tapOn: "Enter your email"
- inputText: "not-an-email"
- tapOn: "Enter your password"
- inputText: "short"
- hideKeyboard

- tapOn:
    id: "signIn.submit"
- assertVisible: "Invalid email format"
- assertVisible: "Password must be at least 8 characters"
