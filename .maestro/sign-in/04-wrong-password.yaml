appId: sk.mkdigital.templateios.debug
name: Sign in — the server refuses a wrong password and the form says so
tags:
  - needs-api
---
# 1. Start the app from a clear state.
# 2. Type the test account's email and a well-formed wrong password.
# 3. Tap Sign In.
# 4. Expect: "Invalid email or password", still on Welcome Back.

- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000

- tapOn: "Enter your email"
- inputText: "test01@mkdigital.sk"
- tapOn: "Enter your password"
- inputText: "WrongPass1@"
- hideKeyboard
- tapOn:
    id: "signIn.submit"

- extendedWaitUntil:
    visible: "Invalid email or password"
    timeout: 30000
- assertVisible: "Welcome Back"
