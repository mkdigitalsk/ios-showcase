appId: sk.mkdigital.templateios.debug
name: Sign in — the server refuses a wrong password and the form says so
tags:
  - needs-api
---
# BR: Sign in · A wrong password is refused, and the user stays on sign in
# Given a fresh install, signed out
# When an existing account's e-mail is sent with a wrong password
# Then `Invalid email or password` shows
# And `Welcome Back` stays on screen

- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000

- tapOn: "Enter your email"
- inputText: "test01@mkdigital.sk"
- tapOn: "Enter your password"
- inputText: "WrongPass1@"
- hideKeyboard
- tapOn:
    id: "signIn.submit"

- extendedWaitUntil:
    visible: "Invalid email or password"
    timeout: 30000
- assertVisible: "Welcome Back"
