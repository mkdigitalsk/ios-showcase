appId: sk.mkdigital.templateios.debug
name: Sign in — the sign-up screen is one tap away and one tap back
---
# BR: Sign in · Sign up opens from sign in and returns to it
# Given a fresh install, signed out
# When the user opens sign up
# Then `Create Account` shows
#
# Given the sign-up form
# When the user returns to sign in
# Then `Welcome Back` shows

- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000

- tapOn: "Sign Up"
- extendedWaitUntil:
    visible: "Create Account"
    timeout: 10000

- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 10000
