appId: sk.mkdigital.templateios.debug
name: Database — search narrows the list and sort reorders it
tags:
  - needs-api
---
# BR: Database · Search narrows the list, and sort reorders it
# Given the notes `Alpha apples` and `Beta bread`
# When the user searches for `apples`
# Then `Alpha apples` is listed and `Beta bread` is not
#
# Given the same two notes, the search closed
# When the user sorts by `Title (Z-A)`
# Then `Beta bread` is listed above `Alpha apples`

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- tapOn: "Database"
- extendedWaitUntil:
    visible: "SwiftData database with CRUD operations.*"
    timeout: 20000

- tapOn: "Enter note title…"
- inputText: "Alpha apples"
- waitForAnimationToEnd
- tapOn: "Done"
- tapOn: "Add Note"
- extendedWaitUntil:
    visible: "Delete All Notes"
    timeout: 10000
- tapOn: "Enter note title…"
- inputText: "Beta bread"
- waitForAnimationToEnd
- tapOn: "Done"
- tapOn: "Add Note"
- extendedWaitUntil:
    visible: "Beta bread"
    timeout: 10000

- tapOn: "Search notes…"
- inputText: "apples"
- extendedWaitUntil:
    notVisible: "Beta bread"
    timeout: 10000
- assertVisible: "Alpha apples"

# iOS 26 draws the search bar's dismiss as a glyph labelled Close, not a Cancel button.
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Beta bread"
    timeout: 10000

- tapOn: "Sort by"
- tapOn: "Title \\(Z-A\\)"
- extendedWaitUntil:
    visible:
      text: "Alpha apples"
      below: "Beta bread"
    timeout: 10000
