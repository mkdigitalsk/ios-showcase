appId: sk.mkdigital.templateios.debug
name: Session — a relaunch keeps the session, and signing out ends it for good
tags:
  - needs-api
---
# BR: Sign in · A session survives a relaunch, and signing out ends it for good
# Given a signed-in user
# When the app is relaunched
# Then Home shows, with no sign-in in between
#
# Given a signed-in user
# When they sign out in Settings
# Then `Welcome Back` shows
# And it still shows after a relaunch

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Networking"
    timeout: 30000
- assertNotVisible: "Welcome Back"

- tapOn: "Settings"
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 20000
- scrollUntilVisible:
    element: "Sign Out"
    centerElement: true
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000
