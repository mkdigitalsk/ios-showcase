appId: sk.mkdigital.templateios.debug
name: Notifications — a reminder is sent, arrives in front, and Cancel All clears it
tags:
  - needs-api
---
# BR: Notifications · The permission is asked for on request
# Given notifications not yet allowed
# When the user requests permission and allows it
# Then `Status: Granted` shows
#
# BR: Notifications · A reminder arrives while the app is in front, and `Cancel All` clears it
# Given notifications allowed
# When the user sends a reminder
# Then `Last sent: Reminder` shows
# And `Last received: <the reminder>` follows once it arrives
#
# Given a sent reminder
# When the user cancels all
# Then `Last sent: Reminder` is gone

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- scrollUntilVisible:
    element: "Notifications"
    centerElement: true
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: "Test local and push notifications"
    timeout: 20000

# launchApp's permissions do not grant notifications on an iOS 26 simulator, so the app asks — the request
# path is under test too. Maestro answers the system prompt itself, so the Allow tap is only a fallback.
- runFlow:
    when:
      visible: "Status: Not determined"
    commands:
      - tapOn: "Request Permission"
      - tapOn:
          text: "^Allow$"
          optional: true
- extendedWaitUntil:
    visible: "Status: Granted"
    timeout: 20000

- tapOn: "^Reminder$"
- extendedWaitUntil:
    visible: "Last sent: Reminder"
    timeout: 10000
# ⚠ The reminder fires a second after the tap, while the app is in front, so the delivery path the app
# delegate owns is what puts "Last received" on screen.
- extendedWaitUntil:
    visible: "Last received: Reminder.*"
    timeout: 20000

- tapOn: "Cancel All"
- extendedWaitUntil:
    notVisible: "Last sent: Reminder"
    timeout: 10000
