appId: sk.mkdigital.templateios.debug
name: Settings — the account shows, the theme changes, the photo source opens, the demo account stays
tags:
  - needs-api
---
# BR: Settings · The signed-in account shows
# Given a signed-in user
# When they open Settings
# Then the account's e-mail from the server shows
#
# BR: Settings · The theme changes to the user's pick
# Given the theme `System`
# When the user picks `Dark`
# Then the theme reads `Dark`
#
# BR: Settings · A profile photo comes from a source the user chooses
# Given Settings
# When the user changes the profile photo
# Then `Select Image Source` offers `Photo Library`
#
# BR: Settings · The demo account cannot be deleted
# Given the demo account
# When Settings shows `Delete account`
# Then `This is a demo account, so it cannot be deleted.` shows with it

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- tapOn: "Settings"
# ⚠ A LabeledContent row is one element whose text is "label, value", and matching is on the whole text.
- extendedWaitUntil:
    visible: "Email, test01@mkdigital.sk"
    timeout: 30000

- tapOn: "Theme, System"
- tapOn: "^Dark$"
- extendedWaitUntil:
    visible: "Theme, Dark"
    timeout: 10000

- tapOn: "Profile Photo"
- extendedWaitUntil:
    visible: "Select Image Source"
    timeout: 10000
- assertVisible: "Photo Library"
# iOS 26 presents the choice as a popover with no Cancel; a tap outside it dismisses.
- tapOn:
    id: "PopoverDismissRegion"
- extendedWaitUntil:
    notVisible: "Select Image Source"
    timeout: 10000

- scrollUntilVisible:
    element: "This is a demo account, so it cannot be deleted."
    centerElement: true
- assertVisible: "Delete account"
