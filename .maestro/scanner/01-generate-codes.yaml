appId: sk.mkdigital.templateios.debug
name: Scanner — text becomes a QR code and a barcode, and scanning says it needs a camera
tags:
  - needs-api
---
# BR: Scanner · Text becomes a QR code or a barcode
# Given a URL typed to encode
# When a QR code is generated
# Then `Generated Code` shows
#
# Given the same URL
# When a barcode is generated
# Then `Generated Code` shows again
#
# BR: Scanner · Scanning needs a camera
# Given a device without a camera
# When the user switches to scanning
# Then `Scanning needs a camera — run on a device.` shows

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- tapOn: "Scanner"
- extendedWaitUntil:
    visible: "Generate and scan QR codes.*"
    timeout: 20000

- tapOn: "Enter text or URL…"
- inputText: "https://mkdigital.sk"
- hideKeyboard
# ⚠ "Generate" is both the mode segment and the button — the button is the one under the field.
- tapOn:
    text: "^Generate$"
    below: "Text to encode"
- extendedWaitUntil:
    visible: "Generated Code"
    timeout: 10000

- tapOn: "Barcode"
- extendedWaitUntil:
    notVisible: "Generated Code"
    timeout: 10000
- tapOn:
    text: "^Generate$"
    below: "Text to encode"
- extendedWaitUntil:
    visible: "Generated Code"
    timeout: 10000

# ⚠ Written for the simulator, which has no camera — the scan pane shows its unsupported state.
- tapOn: "^Scan$"
- extendedWaitUntil:
    visible: "Scanning needs a camera.*"
    timeout: 10000
