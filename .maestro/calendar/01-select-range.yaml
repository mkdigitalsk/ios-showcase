appId: sk.mkdigital.templateios.debug
name: Calendar — two taps make a range and Clear Selection empties it
tags:
  - needs-api
---
# BR: Calendar · Two picked days make a range, and `Clear Selection` empties it
# Given `No dates selected`
# When the user picks a day
# Then `Start: <date>` shows
#
# Given a start date
# When the user picks a later day
# Then `From: <start>` and `To: <end>` show
#
# Given a range
# When the user clears the selection
# Then `No dates selected` shows

- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../shared/sign-in.yaml

- tapOn: "Calendar"
- extendedWaitUntil:
    visible: "Select a date range by tapping two dates"
    timeout: 20000
- assertVisible: "No dates selected"

# ⚠ Two months ahead, so none of the days the demo disables after today is in the way, and days 15
# and 20 appear once in the grid.
- tapOn: "Next month"
- tapOn: "Next month"
- tapOn: "^15$"
- extendedWaitUntil:
    visible: "Start: .*"
    timeout: 10000
- tapOn: "^20$"
# The range reads "From: …" and "To: …" on two lines, and matching is on the whole text — (?s) lets .* cross the newline.
- extendedWaitUntil:
    visible: "(?s)From: .*To: .*"
    timeout: 10000

- tapOn: "Clear Selection"
- extendedWaitUntil:
    visible: "No dates selected"
    timeout: 10000
