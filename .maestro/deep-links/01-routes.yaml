appId: sk.mkdigital.templateios.debug
name: Deep links — a link opens its screen, and the app ones wait for a session
tags:
  - needs-api
---
# BR: Deep links · A link opens its screen — sign up while signed out, the app's screens once signed in
# Given a fresh install, signed out
# When `templateios://sign-up` is opened
# Then `Create Account` shows
#
# Given a signed-in user
# When `templateios://settings` is opened
# Then Settings shows
#
# Given a signed-in user
# When `templateios://database` is opened
# Then Database shows

- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000

- openLink: "templateios://sign-up"
- runFlow: ../shared/open-link.yaml
- extendedWaitUntil:
    visible: "Create Account"
    timeout: 10000
- tapOn: "^Sign In$"
- runFlow: ../shared/sign-in.yaml

- openLink: "templateios://settings"
- runFlow: ../shared/open-link.yaml
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 10000

- openLink: "templateios://database"
- runFlow: ../shared/open-link.yaml
- extendedWaitUntil:
    visible: "SwiftData database with CRUD operations.*"
    timeout: 10000
